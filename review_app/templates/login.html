<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход | NoteVision OMR</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <h1>Экспертная проверка OMR</h1>
    <p>
      Введите общий пароль и своё имя. Ваш прогресс будет храниться отдельно
      от оценок других экспертов.
    </p>
    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
    {% if not password_configured %}
      <div class="alert warning">
        Приложение заблокировано: переменная REVIEW_APP_PASSWORD не задана.
      </div>
    {% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <label>
        Пароль
        <input type="password" name="password" required autofocus>
      </label>
      <label>
        Имя эксперта
        <input name="reviewer_name" value="{{ reviewer_name }}" required
               autocomplete="name">
      </label>
      <button type="submit" class="primary">Войти</button>
    </form>
  </main>
</body>
</html>
